<!-- 体験申込セクション（アコーディオン形式）
     データソース: _data/trial.yml（application）, _data/config.yml（integrations）
     CSS: _sass/components/（trial 系は未実装。_base.scss の素のスタイルで表示）
     JavaScript: assets/js/sections.js（initApplicationForm）

     注: iframe は data-src に退避し、初回展開時に初めて読み込む。
     src を直接書くと display:none でもロードされ、アコーディオンを開かない
     訪問者全員が Google Forms 一式をダウンロードしてしまう。
-->
<section class="trial-application-section" id="trial-application" aria-labelledby="trial-application-title">
    <div class="section-container">
        <div class="section-header">
            <h2 id="trial-application-title">{{ site.data.trial.application.title }}</h2>
            <p class="section-subtitle">{{ site.data.trial.application.description }}</p>
        </div>

        <div class="application-accordion">
            <button type="button"
                    class="application-toggle"
                    aria-expanded="false"
                    aria-controls="application-form"
                    data-icon-expand="{{ site.data.trial.application.expand_icon }}"
                    data-icon-collapse="{{ site.data.trial.application.collapse_icon }}">
                <span class="toggle-header">
                    <span class="material-icons" aria-hidden="true">{{ site.data.trial.application.icon }}</span>
                    <span class="toggle-content">
                        <span class="toggle-title">{{ site.data.trial.application.form.toggle_title }}</span>
                        <span class="toggle-description">{{ site.data.trial.application.form.toggle_description }}</span>
                    </span>
                </span>
                <span class="material-icons toggle-icon" aria-hidden="true">{{ site.data.trial.application.expand_icon }}</span>
            </button>

            <div class="application-form" id="application-form" aria-hidden="true">
                <div class="google-form-container"
                     data-form-url="{{ site.data.core.contact.forms.trial }}">

                    <iframe
                        id="application-iframe"
                        data-src="{{ site.data.core.contact.forms.trial }}?embedded=true"
                        width="100%"
                        height="1200"
                        frameborder="0"
                        marginheight="0"
                        marginwidth="0"
                        title="体験授業申込フォーム"
                        hidden>
                    </iframe>

                    <!-- 読み込み中・エラー表示の共通領域 -->
                    <div id="form-status"
                         class="form-loading-placeholder"
                         aria-live="polite"
                         data-error-title="{{ site.data.trial.application.form.error_title }}"
                         data-error-action="{{ site.data.trial.application.form.error_action }}">
                        <div class="loading-content">
                            <span class="material-icons" aria-hidden="true">{{ site.data.trial.application.icon }}</span>
                            <p class="form-status-title">{{ site.data.trial.application.form.loading_title }}</p>
                            <p class="form-status-note">{{ site.data.trial.application.form.loading_description }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
