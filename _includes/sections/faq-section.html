<!-- よくある質問セクション（トップページ用・抜粋）
     データソース: _data/faq.yml
     CSS: _sass/components/_faq.scss
     JavaScript: assets/js/sections.js（initFAQ）

     全問は /faq/（faq.html）。ここは on_homepage: true のものだけを出す。
     全問を両方のページに置くと重複コンテンツになる。
-->
<section class="faq-section" id="faq" aria-labelledby="faq-title">
    <div class="section-container">
        <div class="section-header">
            <h2 id="faq-title">{{ site.data.faq.title }}</h2>
        </div>

        <div class="faq-list">
            {% for item in site.data.faq.items %}
            {% if item.on_homepage %}
            <div class="faq-item">
                <button type="button" class="faq-question" aria-expanded="false" aria-controls="faq-answer-{{ forloop.index }}">
                    <span class="question-text">{{ item.question }}</span>
                    <span class="material-icons toggle-icon" aria-hidden="true">expand_more</span>
                </button>
                <div class="faq-answer" id="faq-answer-{{ forloop.index }}" aria-hidden="true">
                    <div class="faq-answer-content">
                        {{ item.answer | markdownify }}
                    </div>
                </div>
            </div>
            {% endif %}
            {% endfor %}
        </div>

        <p class="faq-more">
            <a href="{{ '/faq/' | relative_url }}" class="cta-button secondary">
                {{ site.data.faq.homepage_link_text }}
                <span class="material-icons" aria-hidden="true">arrow_forward</span>
            </a>
        </p>
    </div>
</section>
