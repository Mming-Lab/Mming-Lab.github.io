# ========================================
# Jekyll設定ファイル - mmingプログラミング教室
# ========================================
#
# このファイルはJekyll静的サイトジェネレータの
# 全体設定を管理します。
#
# 重要: 設定変更後はJekyllサーバーの再起動が必要
#
# GitHub Pages互換性: 全設定がGitHub Pages準拠
# Ruby: 3.3.4, Jekyll: 3.10.0, github-pages gem: 232
#
# 最終更新: 2024年12月（全体リファクタリング時）
# ========================================

# ========================================
# サイト基本設定
# ========================================
title: mming
description: 特別な配慮が必要な子ども向けプログラミング教室
baseurl: ""
url: "https://mming-lab.github.io"

# 言語・文字コード設定
lang: ja_JP
encoding: utf-8
timezone: Asia/Tokyo

# Google Analytics設定
analytics:
  google: G-7LTNR6JLNM

# Jekyll設定（GitHub Pages準拠）
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
permalink: pretty
incremental: false

# プラグイン
# GitHub Pages がサポートするもののうち、実際に機能しているものだけを有効にする。
#
# 以前は8つ有効だったが、以下の5つは何も仕事をしていなかった:
#   jekyll-optional-front-matter … front matter の無い .md をページ化する。
#       _posts/ の記事は全て front matter を持つので不要。
#       かつ CLAUDE.md が /CLAUDE/ として公開される事故の原因だった
#   jekyll-readme-index          … README.md は exclude 済み
#   jekyll-titles-from-headings  … 全ページ・全記事が title を持つ。
#       「本文に h1 を書くと title に昇格して重複する」罠だけが残っていた
#   jekyll-relative-links        … 記事内の内部リンクは /blog/... の絶対パス
#   jekyll-default-layout        … defaults で layout を指定している
plugins:
  - jekyll-feed          # /feed.xml を生成
  - jekyll-sitemap       # /sitemap.xml を生成
  - jekyll-redirect-from # 記事の旧URLを維持（_posts の redirect_from）

# ビルド設定
source: .
destination: ./_site
# 除外ファイル
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CLAUDE.md
  - _site_backup_*
  - LICENSE
  - CHANGELOG.md
  - docker-compose.yml
  - Dockerfile
  - "*.sh"
  - .claude/

# デフォルト設定
defaults:
  # ルート直下の *.html など（type を指定しないと全ドキュメントが対象）
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "ja"
      permalink: "/blog/:slug/"
  - scope:
      path: ""
    values:
      lang: "ja"

# Sass設定
sass:
  sass_dir: _sass
  style: compressed  # プロダクション用に圧縮
  sourcemap: false   # ファイルサイズ削減


# SEO設定（プラグイン用のため維持）
# Jekyll SEOプラグインが参照するため、基本情報のみ保持
# 詳細なサイト情報は _data/config.yml で管理

# Google Analytics（必要に応じて設定）
# google_analytics: UA-XXXXXXXXX-X

# 投稿表示設定
future: false         # 未来日付の記事は非表示（dev.sh でも --future を付けないこと）
show_drafts: false    # _drafts/フォルダの下書きを非表示
unpublished: false    # published: false の記事を非表示

# Liquidテンプレート最適化設定
liquid:
  error_mode: warn          # Liquidエラー時は警告表示（ビルド継続）
  strict_filters: false     # 厳密なフィルター検証を無効化（パフォーマンス向上）
  strict_variables: false   # 厳密な変数検証を無効化（パフォーマンス向上）

# Jekyllビルド最適化設定
profile: false              # ビルド時間プロファイルを無効化（本番用）
strict_front_matter: true  # Front Matterの不正はビルド失敗にする（壊れた記事の公開を防ぐ）

# ローカル開発サーバー設定
livereload: true            # ファイル変更時の自動リロード機能
port: 4000                  # 開発サーバーのポート番号
host: 0.0.0.0              # 全IPアドレスからのアクセスを許可（Docker対応）
