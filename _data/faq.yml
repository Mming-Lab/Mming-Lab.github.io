# ========================================
# よくある質問
# ========================================
#
# 使用場所:
# - /faq/（faq.html）… 全問
# - index.html → faq-section.html … on_homepage: true のものだけ
#
# 表示形式: アコーディオン（_includes/sections/faq-section.html）
# JavaScript: assets/js/sections.js（initFAQ）
#
# 【増やし方】
# 体験や面談で実際に聞かれたことを1問足していくのが、いちばん続く。
# ここに書く答えは「確認できる事実」に限る。運用を変える答えを想像で書かない。
#
# 【重複を避ける】
# 体験当日の詳細は _data/trial.yml の day_of が正本。
# FAQ では短く答えて /trial/ に誘導する。両方に長文を置かないこと。
#
# 【文章の作法】
# おたよりテンプレートと同じ。専門用語と分析的な表現を避け、
# 1文は30〜60字、箇条書きにしない。
# ========================================

title: "よくある質問"

# トップページ用の導線（_includes/sections/faq-section.html が使う）
homepage_link_text: "よくある質問をすべて見る"

items:
  # ========================================
  # 対象・向き不向き
  # ========================================

  - question: "どんなお子様が向いていますか？"
    on_homepage: true
    answer: |
      考えることや試行錯誤を楽しめるお子様に向いています。
      「なんで動かないんだろう？」「こうしてみたらどうなるかな？」と
      自分で追いかけようとするお子様だと、面白さが伝わりやすいです。

      教材が「自分で考えて進める」形になっているため、
      考えること自体が楽しくないお子様には、続けるのが難しいと思います。

  - question: "どんなお子様が対象ですか？"
    on_homepage: true
    answer: |
      発達特性のあるお子様専門の教室です。
      療育・放課後等デイサービス・特別支援学級などに在籍されている方、
      過去に利用されていた方、発達障害・グレーゾーンなど
      特性をお持ちのお子様が対象です。

      同じような環境のお子様だけのクラスなので、
      お互いを受け入れ合いながら過ごせます。

  - question: "何歳から通えますか？"
    on_homepage: true
    answer: |
      小学生のお子様が中心です。
      中学生のお子様、就学前のお子様については、ご相談ください。
      年齢よりも、考えることを面白がれるかどうかで見ています。

  - question: "診断がなくても大丈夫ですか？"
    answer: |
      診断の有無は問いません。
      グレーゾーンと言われている方、診断は受けていないけれど
      気になることがあるという方も対象です。

  - question: "プログラミング経験がなくても大丈夫ですか？"
    on_homepage: true
    answer: |
      経験は必要ありません。ほとんどのお子様が未経験から始めています。
      マインクラフトの画面でブロックを組んでいく形なので、
      文字を打たずに始められます。

      必要なのは経験ではなく、考えることを面白がれるかどうかです。
      そこは体験のときに、一緒に見させてください。

  # ========================================
  # 体験について
  # ========================================
  # 注: 詳細は _data/trial.yml の day_of が正本。ここでは短く答えて誘導する

  - question: "体験は無料ですか？"
    answer: |
      無料です。入会のお約束も必要ありません。

  - question: "体験はどのくらい時間がかかりますか？"
    answer: |
      30分程度です。
      お子様の様子を見て、短く切り上げることもあります。

  - question: "体験では何をしますか？"
    answer: |
      教育版マインクラフトを使って、プログラミングを体験していただきます。
      まずパソコンでの操作に慣れるワールドを進めて、
      そのあとプログラミングのワールドに入ります。

  - question: "体験のとき、保護者も一緒にいられますか？"
    answer: |
      同席いただけます。そばで見守っていただいて構いません。

  - question: "体験中に子どもがしんどくなったら、どうなりますか？"
    answer: |
      テントのあるセンサリースペースで休めます。
      それでも辛ければ、途中で帰っていただいて構いません。

  - question: "体験に持っていくものはありますか？"
    answer: |
      パソコンなどの機器は教室でお貸しします。
      飲み物やイヤマフなど、お子様が落ち着けるものがあればお持ちください。

  - question: "授業を見学できますか？"
    answer: |
      体験のときに、お部屋はご覧いただけます。
      ただし、在籍しているお子様の授業そのものを見学いただくことはできません。
      お子様の特性に配慮しているためで、通われるようになってからも同じように守ります。

  - question: "申し込んだあと、いつ連絡がきますか？"
    answer: |
      2〜3日以内にメールでご連絡します。
      届かない場合は、迷惑メールフォルダもご確認ください。

  - question: "体験後に入会を断ることはできますか？"
    on_homepage: true
    answer: |
      もちろんです。無理な勧誘は一切いたしません。
      お子様が「また来たい」と思えるかが一番大切です。
      体験後、ご家庭でゆっくりご検討ください。

      こちらから見て合わないと思ったときも、正直にお伝えします。

  # ========================================
  # 通うことについて
  # ========================================

  - question: "どんなカリキュラムですか？"
    on_homepage: true
    answer: |
      決まったカリキュラムはありません。
      お子様の様子を見ながら、進め方も教材も変えていきます。

      読むのが負担そうなら文字の少ないものに、
      手を動かしたい時期なら動かせるものに切り替えます。
      「まだ一歩手前の段階かもしれない」と思えば、戻ることもあります。

  - question: "クラスはどうやって決まりますか？"
    answer: |
      体験のあとで、お子様の様子と、すでに通っているお子様との相性を考えて、
      こちらから1〜2つのクラスをご提案します。
      ご案内できるクラスがないときは、体験のお申し込みを止めています。
      お申し込みいただける状態であれば、ご案内できるクラスがあります。

  - question: "送迎は必要ですか？"
    answer: |
      送迎のお子様、1人で交通機関を利用するお子様、それぞれです。
      お子様の成長段階に合わせて、より良い交通手段を選んでください。
      教室の近くにコインパーキングがあります。

  - question: "教室の雰囲気はどんな感じですか？"
    on_homepage: true
    answer: |
      少人数で、一人ひとりのペースを大切にしています。
      静かな場所が好きな子も、みんなのいる場所が好きな子も、
      その日の調子で選べるようにしています。
