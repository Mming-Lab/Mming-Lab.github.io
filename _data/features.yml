# ========================================
# mmingプログラミング教室 - 特徴セクション設定
# ========================================
#
# 使用場所: index.html > features-section.html
# 表示順序: ヒーロー → 教室について → **特徴（ここ）** → FAQ → 料金 → アクセス → チーム
#
# このファイルはmmingの3つの核心価値を定義し、
# 画像スライダー付きのアコーディオンカードとして表示されます。
#
# 重要: 01→02→03の順序で表示され、各特徴は詳細な画像とポイントを含みます
#

# セクション基本情報
title: "居場所であるために、していること"
subtitle: "毎回の授業のあとに記録を取りながら、少しずつ整えてきたことです"
# ========================================
# 3つの特徴詳細定義
# ========================================
#
# 各特徴の構成:
# - 基本情報: id, number, title, summary, icon
# - 画像: main（メイン画像）+ detail（詳細画像群）
# - 詳細説明: details配列（タイトル + 内容 + ポイント）
#
# 表示形式: アコーディオンカード + 画像スライダー
# 注: images.detail は常に配列で書く（単一画像でも - src: から始める）
# JavaScript: assets/js/sections.js で制御
#

items:
  # ========================================
  # 特徴01: 当事者性による支援
  # ========================================
  - id: "safety" # 識別子（CSS・JavaScript用）
    number: "01" # 表示番号（視覚的順序）
    title: "伝わらなかったときは、伝え方を変えます"
    summary: "代表自身が発達障害の当事者です。できない理由をお子様に求めず、こちらの渡し方を見直します"
    icon: favorite # Material Iconsアイコン名
    # 画像設定（画像スライダー用）
    images:
      main: # メイン画像（最初に表示）
        src: "assets/images/features/safety_main.webp" # 画像パス
        alt: "テントがあるセンサリ―スペースの様子" # アクセシビリティ用alt属性
        caption: "センサリ―スペース"
        width: 600 # 推奨幅（iPhone最適化: 600x600推奨）
        height: 600 # 推奨高さ
      detail: # 詳細画像（スライダーで切り替え）
        - src: "assets/images/features/safety_detail.webp"
          alt: "寄り添った声掛けの様子"
          caption: "寄り添った声掛け"
          width: 600 # 注: iPhone向けは正方形(600x600)が最適
          height: 600
    # 詳細説明（アコーディオン展開時に表示）
    details:
      - title: "同じ経験をしてきた指導者" # 詳細見出し
        content: "どこでつまずいているのかを、自分が通ってきた道と照らして探します"
        points: # 具体的なポイント（アイコン付きリスト）
          - icon: "hearing" # Material Iconsアイコン
            text: "感覚過敏の辛さを体感として知っています"
          - icon: "visibility"
            text: "「できない」の裏にある本当の困りごとに気づけます"
          - icon: "chat_bubble"
            text: "どんな声のかけ方なら届くか、どのタイミングなら届くかを探します"
      - title: "保護者の方とも同じ目線で"
        content: "お子様だけでなく、保護者の方のしんどさも、経験した側として受け止めます"
        points:
          - icon: "question_answer"
            text: "『うちの子だけ？』という不安に経験からお答えします"
          # - icon: "lightbulb"
          #   text: "家庭での接し方のヒントも具体的にアドバイス"
          - icon: "feedback"
            text: "教室での様子は毎月おたよりでお伝えします。家と顔が違う子もいます"

  # ========================================
  # 特徴02: 学習環境の個別最適化
  # ========================================
  - id: "environment" # 識別子
    number: "02" # 表示番号
    title: "その日の調子で、居場所を選べます"
    summary: "体調や気分は日によって変わります。テントのある静かな場所も、みんなのいる場所も選べます"
    icon: settings # Material Icons（設定・調整を表現）
    images:
      main:
        src: "assets/images/features/environment_main.webp"
        alt: "最適化された学習環境の全体像"
        caption: "上下昇降デスクとバランスボール"
        width: 600
        height: 600
      detail:
        - src: "assets/images/features/workspace.webp"
          alt: "ワークスペースの様子"
          caption: "ワークスペース"
          width: 600
          height: 600
        - src: "assets/images/features/individual_space.webp"
          alt: "仕切りで区切られた個別スペース"
          caption: "個別スペース"
          width: 600
          height: 600
        - src: "assets/images/features/mc_furigana.webp"
          alt: "マイクラにふりがな対応"
          caption: "漢字が読めなくても止まらないように、ふりがなを付けました"
          width: 600
          height: 600
        - src: "assets/images/features/furigana_block.webp"
          alt: "ふりがな対応ブロックの画面"
          caption: "プログラミングのブロックにも、<br>ふりがなを付けました"
          width: 600
          height: 600
        - src: "assets/images/features/agent_left_right.webp"
          alt: "エージェントの航行灯仕様"
          caption: "左右が分かりにくいときのために、<br>光の色で向きが分かるようにしました"
          width: 600
          height: 600
    details:
      # 注: 以前は「ワークスペース」「個別スペース」「上下昇降デスク」という
      # 施設の言い方だった。要約で「テントのある静かな場所」と書いているのに
      # 開くと施設用語になり、開いたほうが冷たく読めていた。
      # 設備名ではなく、何のためにあるかで書く。
      - title: "しんどくなったら、離れていい場所があります"
        content: "無理に輪の中にいなくて構いません。離れることを、こちらから勧めることもあります"
        points:
          # 注: テントは音を遮れない。視線と人の気配を切るためのもの。
          #     音がしんどいときはヘッドホンで別に対応している。
          - icon: "self_improvement"
            text: "テントのある場所。人の目から隠れて、ひとりになれます"
          - icon: "groups"
            text: "みんなのいる場所。離れていても、いつでも戻ってこられます"
          - icon: "height"
            text: "考えるときに体を動かしたくなる子のために、高さの変わる机があります"

      - title: "足りない道具は、作ります"
        content: "売っているものでは足りないところは、こちらで作っています"
        points:
          - icon: "translate"
            text: "漢字でつまずかないように、マインクラフトとプログラミングのブロックにふりがなを付けました"
          - icon: "navigation"
            text: "左右が分かりにくいときのために、光の色で向きが分かるようにしました"

  - id: "method"
    number: "03"
    # 注: 前半/後半の話だけでなく、進み方・見方（ソースレビュー）・復習の扱いまで
    # 含むため、タイトルは「どう学ぶか」を覆う形にしている。
    # 「同じ場所にいられた日を成長として数える」は後半30分の中に移した。
    title: "ひとりで考える時間と、みんなと作る時間"
    summary: "前半はひとりで、後半はみんなと。進み方も、つまずいたときの戻り方も、一人ひとり違います"
    icon: groups
    images:
      main:
        src: "assets/images/features/method_main.webp"
        alt: "マインクラフト風のハイブリッド授業"
        caption: "ハイブリッド授業"
        width: 600
        height: 600
      detail:
        - src: "assets/images/features/method_detail.webp"
          alt: "マインクラフトでの協働実践イメージ図"
          caption: "マインクラフトでの協働実践"
          width: 600
          height: 600
    details:
      # 【ソースレビューと復習のシール】
      # 「動けば正解」としていた時期に、同じ命令をただ並べて先へ進んでしまい、
      # まとめ方を覚えないまま次に入るお子様が続出した。そのため教材を改造して
      # 組んだ命令を確認できるようにした。シールはレビューを受けるともらえる。
      #
      # 独立した項目にすると「ちゃんとやらせる教室」に読めてしまう。
      # 前半30分にしていることなので、ここに畳んで子どもの側から書く。
      #
      # 注: 一歩手前から始めるクラスは faq.yml（トップにも表示）と
      #     ブログ記事に書いてあるので、ここでは繰り返さない。
      - title: "前半30分：ひとりで考える時間"
        content: "一斉授業はしません。組んだ命令を一緒に見ながら、一人ずつ進めます"
        points:
          - icon: "speed"
            text: "一気に進む子も、何度も前に戻って復習する子もいます。急かしません"
          - icon: "visibility"
            text: "分からないまま先へ進ませません。あとでもっとつらくなるからです"
          - icon: "celebration"
            text: "戻ることを嫌なことにしません。「今日は復習にする」と自分で決める子もいます"

      - title: "後半30分：みんなと作る時間"
        # 注: 以前ここに研究論文3本を引用し「認知的柔軟性が有意に改善」
        # 「社会性スキルが実生活にも向上」と書いていた。この位置に置くと
        # 治療効果の主張に近く読めてしまうため、教室で実際に見てきたことに
        # 差し替えている。療育の代替をうたわないこと。
        content: "好きなものを通じて、自然に関わりが生まれる場をつくっています"
        points:
          - icon: "construction"
            text: "建築・採掘・デザインなど役割を分けて、一緒にひとつのものを作ります"
          - icon: "chat_bubble"
            text: "好きなものの話題だと、言葉が出やすくなることがあります"
          - icon: "groups"
            text: "同じ場所にいられた日を、それだけで成長として数えています"

# 画像スライダー設定
