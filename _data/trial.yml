# ========================================
# 体験申込みページ - コンテンツ設定
# ========================================
# 使用箇所: trial/index.html および _includes/trial/ 配下
#
# 【ブロックの役割分担】
# hero        … ページの導入
# belief      … mming の約束（理念・姿勢）
# day_of      … 体験当日の「確認できる事実」。理念を混ぜないこと
# application … 申込フォーム周り
#
# 注: 対象者の条件は _data/core/eligibility.yml が正本（トップページと共有）。
# 注: ページの title / description は trial/index.html の front matter が正本。
#     front matter には Liquid が効かないためデータから供給できない。
#     「HTMLに文言を直書きしない」方針の唯一の例外。
# ========================================

# ヒーローセクション
hero:
  title: "体験申込み"
  subtitle: "発達特性のあるお子様のための専門プログラミング教室"
  message: "お子様の特性に合わせた学習環境で、プログラミングの楽しさを体験してみませんか？"
  note: "体験を通じて、お子様に合うかどうかをご確認いただけます。合わないと感じられたら、そのままお伝えください。"

# mmingの価値観セクション
belief:
  title: "mmingの3つの約束"
  subtitle: "居場所であることを、何より優先しています"
  message: "プログラミングを学ぶ場所です。そのうえで、ここにいて大丈夫だと思える場所であることを大切にしています。"
  items:
    - icon: "favorite"
      text: "心理的安全性を最優先にします"
    - icon: "tune"
      text: "お子様に合わせた環境を整えます"
    - icon: "psychology"
      text: "考えることを楽しむ気持ちを大切にします"
  # 注: 成果（「できた！」）ではなく状態を語る。体験の時点で成果を約束しない。
  # about.yml の promises「気を使わずありのままでいられる環境」と声を揃えている。
  additional_message: "まずは教室の雰囲気と、お子様が気をつかわずにいられるかどうかを見ていただければと思っています。"

# 対象者セクションの見出し（条件そのものは _data/core/eligibility.yml が正本）
eligibility_heading: "対象となるお子様・向いているお子様"

# ========================================
# 体験当日の事実
# ========================================
#
# 【このブロックの役割】
# 申込を判断するために必要な「確認できる事実」だけを置く。
# 約束や理念は belief ブロックの担当なので、ここに混ぜないこと。
#
# 以前この情報が一切なく、体験ページには「無料」の文字さえ存在しなかった。
# 当日の流れが分からないまま申し込むのは負担が大きいので、
# 先に書いておく。
#
# 注: icon は _data/icons.yml に登録済みのものだけを使う。
#     未登録の名前を書くと、フォントにグリフが無く画面に英単語が表示される。
# 注: 場所（住所・地図）はテンプレート側で _data/core/contact.yml と
#     _data/access.yml から組み立てる。住所の正本は core/contact.yml。
# ========================================
day_of:
  title: "体験について"
  lead: "お申し込みの前に知っておいていただきたいことをまとめました。"

  items:
    # 体験で実際にすること。
    # 「うちの子に合うか確かめたい」というニーズは、適性の採点ではなく
    # 当日の流れの描写で満たす。文面は実際の申込フォームと一致させている。
    - icon: sports_esports
      label: "体験の内容"
      text: "教育版マインクラフトを使って、プログラミングを体験していただきます。"
      list:
        - "パソコンでのマインクラフトの操作に慣れるワールド（1〜2）"
        - "教育版マインクラフトのプログラミングワールド"

    - icon: payments
      label: "費用"
      text: "体験は無料です。入会のお約束は必要ありません。"

    - icon: schedule
      label: "所要時間"
      text: "30分程度です。お子様の様子を見て、短く切り上げることもあります。"

    - icon: groups
      label: "保護者の同席"
      text: "同席いただけます。そばで見守っていただいて構いません。"

    # 見学について。
    # 「授業は見せない」という事実だけでなく理由まで書く。
    # 在籍児の特性に配慮しているという理由は、これから通う側にとっても
    # 「自分の子も同じように守られる」と読める安心材料になる。
    - icon: visibility
      label: "教室の見学"
      text: "体験のときに、お部屋はご覧いただけます。ただし、在籍しているお子様の授業そのものを見学いただくことはできません。お子様の特性に配慮しているためで、通われるようになってからも同じように守ります。"

    - icon: self_improvement
      label: "しんどくなったとき"
      text: "テントのあるセンサリースペースで休めます。それでも辛ければ、途中で帰っていただいて構いません。"

    - icon: backpack
      label: "持ち物"
      text: "パソコンなどの機器は教室でお貸しします。飲み物やイヤマフなど、お子様が落ち着けるものがあればお持ちください。"

    - icon: school
      label: "対象"
      text: "小学生のお子様が中心です。中学生・就学前のお子様はご相談ください。"

    - icon: mail
      label: "お申し込みのあと"
      text: "2〜3日以内にメールでご連絡します。届かない場合は迷惑メールフォルダもご確認ください。"

    - icon: event_available
      label: "クラスのご案内"
      text: "体験のあとで、お子様の様子と在籍のお子様との相性を考えて、1〜2つのクラスをご提案します。ご案内できるクラスがないときは体験のお申し込みを止めているので、お申し込みいただける状態であれば、ご案内できるクラスがあります。"

  # 場所の見出し（住所と地図リンクはテンプレートがデータから組み立てる）
  location_label: "場所"

  # 体験後に断れることの明示。
  # FAQ にも同趣旨があるが、申込ボタンの手前で読めることが重要
  closing: "合わないと感じられたら、そのままお伝えください。無理なお引き止めはいたしません。こちらから見て合わないと思ったときも、正直にお伝えします。"

# ========================================
# 体験申込みセクション
# ========================================
application:
  title: "体験授業のお申し込み"
  description: "上のご案内をご覧いただいたうえで、お申し込みください。"
  icon: "assignment"
  expand_icon: "expand_more"
  collapse_icon: "expand_less"

  # フォーム関連
  # 注: toggle_title / toggle_description は「審査の関門」ではなく
  #     「表示操作の説明」として書く。以前は「上記の条件を確認してから
  #     こちらをクリックしてお申し込みください」で、直前にある
  #     「向いていません」の注記と結合して選抜の合図に読めていた。
  form:
    toggle_title: "フォームを表示する"
    toggle_description: "表示しただけでは送信されません。入力は5分ほどです。"
    loading_title: "フォームを準備しています..."
    loading_description: "しばらくお待ちください..."
    error_title: "フォームを表示できませんでした"
    error_action: "別ウィンドウで開く"
