# ========================================
# 教室についてセクション
# ========================================
# 使用箇所: index.html → _includes/sections/about-section.html
#
# データ構造:
# - title / message       : セクションヘッダー
# - target_info.lead_text : 対象者情報の導入文
#                           （条件そのものは _data/core/eligibility.yml が正本）
# - expertise_summary     : 当事者性の要約
# - philosophy            : 教室の姿勢（段落）
# - promises              : 大切にしていること（段落）
#
# 【文章の作法】
# 保護者に向けて書くときの作法は、おたよりテンプレートと同じにする。
#   含める : 具体的なこと／その子らしさ／温かい表現
#   避ける : 内部の専門用語や分析的な表現／パターン化された文章／箇条書き
#   長さ   : 1文は30〜60字、1段落は2〜4文
# この方針で promises を箇条書きから段落に変えている。
# ========================================

# セクションヘッダー
title: "なぜmmingなのか"
message: "学校でも療育でもない、もう一つの居場所"

# 対象者情報
target_info:
  # 導入メッセージ（HTMLタグ使用可能）
  lead_text: "mmingは、発達特性のあるお子様のための専門教室です。<br>一人ひとり異なる特性を受け入れ合える仲間がいるから、安心して学べます。"

  # 注: 対象者の条件リストは _data/core/eligibility.yml が正本（複数箇所から参照）

# 当事者性の要約
expertise_summary: "代表は発達障害の当事者、メンターはシステムエンジニアとして、それぞれの専門性を活かした環境設計と学習支援を提供します。"

# 教室の姿勢
philosophy: |
  『うちの子は教室に馴染めるだろうか？』『ちゃんと受け入れてもらえるだろうか？』そんな不安を抱えた保護者の方々へ。
  私たちは発達特性が、お子様と保護者の方にとってどれほど大変なものか知っています。
  代表は、自身も発達特性を持ち、発達特性のある子どもの保護者でもあります。
  「『うちもそうです』と自然に言い合える環境」がどれほど救いになるか知っているからこそ、
  安心して学べる専門環境をつくりました。
  当事者・保護者両方の視点から、お子様と保護者の方に寄り添います。

# mmingが大切にしていること
# 注: 以前は4項目の箇条書きだった。おたよりの作法に合わせて段落形式にし、
# 内容も「毎授業後の記録で実際にしていること」に置き換えている。
promises:
  title: "mmingが大切にしていること"
  icon: favorite
  body: |
    お子様に合う場所を探して、ここまで来てくださったのだと思います。

    発達特性のあるお子様のなかに、プログラミングにのめり込む子がいます。考えるのが好きで、うまくいかないことも含めて試すのが面白い、という子です。mming は、その子のための教室です。

    そのうえで、ここが「居場所だ」と思える場所であることを何より大切にしています。

    うまく伝わらなかったときは、お子様ではなく自分たちの伝え方を見直します。口で言って届かなければ、目で見える形にします。その日の体調や天気、教室の音の具合まで、調子に関わることとして記録に残しています。

    「やりません」と言えることも、大切な力だと考えています。黙って流さずに断れること、「分からない」と声に出せること。それができた日は、成長として受け止めます。

    こだわりがあるときは、納得するまで待ちます。満足したら次に進めばいい、というゆっくりの歩みでよいと思っています。

    私たちが「成長した」と感じるのは、課題が解けた日だけではありません。みんなと同じ場所で過ごせた日、自分の気持ちを言葉にできた日、やりたくないと伝えられた日。そういうことを、同じくらい大きなこととして受け止めています。
