# ========================================
# 記事末尾の教室紹介
# ========================================
#
# 使用場所: _layouts/post.html → _includes/components/post-classroom-note.html
#
# 【なぜ置くか】
# 記事はどれも教室の授業のために作ったものの紹介で、記事だけ読んでも
# 教室の存在が分からなかった。記事9本のうち7本は本文内のリンクも無く、
# 読み終わったところで行き止まりになっていた。
#
# 【書いてはいけないこと】
# 「生徒募集中」のような売り込み。サイト全体で取っている
# 「正直に線を引く」という姿勢と矛盾する。事実の提示にとどめる。
#
# 【向いていない子の明示を外さない】
# 読んだ方が、合うかどうかを自分で判断できるようにするため。
# 対象の条件と注意書きは _data/core/eligibility.yml が正本。
# ========================================

title: "この記事を書いている教室について"

# 【フッターと重複させない】
# 教室であること・発達特性のあるお子様が対象であること・鹿児島市であることは
# フッターの説明文（config.yml の site.description）が全ページで伝えている。
# ここで繰り返さず、フッターに無いもの（対象の具体的な条件、向いていない子の
# 明示、紹介のお願い）だけを書く。
body:
  - "ここで公開している教材やツールは、どれも教室の授業のために作ったものです。土曜日に、少人数で授業をしています。"

referral_lead: "学校や施設で、プログラミングに強く興味を持っているお子様がいらっしゃいましたら、こういう場所もあるとお伝えいただけると嬉しいです。対象は次のとおりです。"

links:
