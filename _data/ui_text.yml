# ========================================
# レイアウト横断の共通UI文言
# ========================================
#
# 【このファイルの役割】
# 特定のセクションに属さない、レイアウト・ナビ・フッターの共通文言。
# セクション固有の文言は各セクションのデータファイルに置く。
#
# 【注意】
# 以前は33行あったが実際に使われていたキーは3つだけで、残りは死蔵だった。
# 一方で「サイト情報」「フォローしてください」などは HTML に直書きされており、
# 「死蔵キー + 直書き」という最悪の組み合わせになっていた。
# ここに置くキーは必ず参照元を持たせること。
# ========================================

# ナビゲーション
# 参照元: _layouts/default.html, _includes/header.html
navigation:
  skip_to_main: "メインコンテンツにスキップ"
  mobile_menu_open: "メニューを開く"
  mobile_menu_close: "メニューを閉じる"
  main_navigation_label: "メインナビゲーション"

# 共通ボタン
# 参照元: _includes/sections/features-section.html（詳細アコーディオン）
buttons:
  show_details: "詳しく見る"
  hide_details: "閉じる"

# フッター
# 参照元: _includes/footer.html
footer:
  social_heading: "フォローしてください"
  links_heading: "サイト情報"
  copyright: "All rights reserved."

# アクセシビリティラベル
# 参照元: _includes/footer.html（固定CTA）
aria:
  cta_section: "行動を促すボタン"
