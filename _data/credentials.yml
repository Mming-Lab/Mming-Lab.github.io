# ========================================
# 実績・掲載（正本）
# ========================================
#
# 使用場所: /about/media/（about-media.html）
#
# 【このファイルの役割】
# 「この教室は信用できるのか」の根拠になる、外部から検証できる事実を集めたもの。
# 以前は _posts/2025-06-01-media-coverage.md（日付付きの記事）と
# _data/team.yml（資格）に散らばっており、記事の方は時系列に埋もれていた。
#
# 【書いてよいもの】
# 外部のURLで確認できる事実だけ。
# 「保護者満足度95%」「継続率90%」のような内部の目標値は書かない（実績ではない）。
#
# 【広告は「掲載」ではない】
# 費用を払って載せた枠は、第三者が取り上げた事実ではないので
# 信用の裏付けにならない。このファイルには書かないこと。
# 判断の経緯は .claude/operations.md（非公開）にある。
# ========================================

title: "実績と掲載"
lead: |
  mming の取り組みを、メディアや教育関係の場で取り上げていただいています。
  教材の公開や大会の審査など、教室の外での活動もあわせてご紹介します。

# ========================================
# メディア掲載
# ========================================
media:
  title: "メディア掲載"
  items:
    - name: "FNNプライムオンライン"
      note: "発達特性のある子どもへのプログラミング教育について取り上げていただきました。"
      url: "https://www.fnn.jp/articles/-/833523"

    - name: "スタディチェーン"
      note: "プログラミングスクールの特集で、mming の取り組みを紹介していただきました。"
      url: "https://studychain.jp/picks/programing-school/"
      # 掲載料は発生していないが、掲載の条件が「こちらからもリンクを貼ること」
      # だったため相互リンクにあたる。Google はリンクの交換をリンクスキームとして
      # 扱うことがあるので nofollow を付ける。
      nofollow: true

# ========================================
# 資格・認定
# ========================================
# 注: 氏名と肩書は _data/team.yml が正本。ここでは役割で書く
credentials:
  title: "資格・認定"
  items:
    - name: "発達障害児支援士"
      holder: "代表"

    - name: "発達支援教育士認定講師"
      holder: "代表"

    - name: "教育版マインクラフトアンバサダー"
      holder: "メンター"

    - name: "Minecraftカップ 地区大会審査員（第5・6回）"
      holder: "メンター"

# ========================================
# 教材の公開
# ========================================
materials:
  title: "教材の公開"
  lead: |
    教室で使うために作った教材を、学校の先生方にも使っていただけるよう
    「授業・校務活用素材ポータル」で公開しています。すべて無料です。
  portal_name: "授業・校務活用素材ポータル"
  portal_url: "https://kyouzai.jp/"
  note: "公開している教材は、記事でも紹介しています。"
  related_posts:
    - text: "教育版マインクラフト用MakeCode拡張機能3種を公開しました"
      url: "/blog/minecraft-makecode-extensions/"
    - text: "共に創る未来 - 教育版マイクラの可能性を広げて"
      url: "/blog/educational-tools/"
