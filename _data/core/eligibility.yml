# ========================================
# 対象者の条件（正本）
# ========================================
#
# 【このファイルの役割】
# 「誰が対象か」という事実を1箇所にまとめたもの。
# 以前は同じ3項目が about.yml / trial.yml / confirmation.yml の
# 3ファイルに逐語で重複しており、文言を直すと整合が崩れる状態だった。
#
# 参照元:
# - _includes/sections/about-section.html（トップページの対象者情報）
# - _includes/trial/trial-belief-section.html（体験ページ）
#
# 注: _data/faq.yml の「どんなお子様が対象ですか？」は意図的に別管理。
# FAQ の回答は固有の文脈を持つ散文で、リストを埋め込むと不自然になる。
# ========================================

# 必要条件（対象となるお子様）
requirements:
  title: "対象となるお子様"
  lead: "以下のいずれかに該当するお子様が対象です："
  items:
    - "療育・放課後等デイサービス・特別支援学級などに在籍中のお子様"
    - "過去に上記サービスを利用されていたお子様"
    - "発達障害・グレーゾーンなど特性をお持ちのお子様"

# 十分条件（より適している特徴）
ideal_traits:
  title: "特に向いているお子様"
  lead: "そのうえで、mming が力になれるのはこんなお子様です："
  items:
    - "考えることが好き・楽しいと感じる"
    - "「うまくいかない」ことも含めて試行錯誤を楽しめる"
    - "「なぜ？」「どうして？」という疑問を持ちやすい"
    - "自分で考えて問題解決に取り組める"
  note: "mming の教材は、自分で考えて進める形になっています。考えること自体が楽しくないお子様には、続けるのが難しいと思います。ここは最初にお伝えしておきます。"
