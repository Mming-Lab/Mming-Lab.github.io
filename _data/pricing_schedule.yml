# ========================================
# 料金・スケジュールセクション
# ========================================
#
# 【このファイルの役割】
# _includes/sections/pricing-schedule-section.html が描画する1セクション分の
# データ。以前は pricing.yml と schedule.yml に分かれていたが、表示は1つの
# セクションで、しかも pricing.yml の title が「料金・スケジュール」と
# 両方を名乗っていたため、ファイル境界と表示単位が一致していなかった。
#
# 【クラス決定の実際の流れ】
# 家庭が時間割から枠を選ぶ形ではない。体験でお子様の特性を見て、在籍生との
# 相性を考えたうえで mming 側から1〜2クラスを提案する。時間割は「どの時間に
# クラスがあるか」を示すもので、選択肢の一覧ではない。凡例の文言はこの前提で
# 書いているので、空席表のように書き換えないこと。

# 【更新頻度が高い箇所】
# - plan.price   : 月謝
# - enrollment_fee.amount : 入会金
# - schedule_table : 時間割
# - full_classes : 満員クラス（該当する記号のコメントを外す）
#
# 【重要な不変条件】
# schedule_table.headers の個数 - 1 == 各 rows[].slots の個数
# （headers の先頭は曜日列のため）。これを崩すと表が黙って崩れる。
# ========================================

# セクション見出し
title: "料金・スケジュール"

# ========================================
# 料金
# ========================================
# トップページに置く要約（全文は /pricing/）
# 注: 全文を両方のページに置くと重複コンテンツになるため、
# トップは要約＋リンクに留める。
summary:
  title: "料金・スケジュール"
  # 注: 金額は plan / enrollment_fee から組み立てるのでここには書かない。
  # 文字列で持つと料金改定のときに2箇所直す必要が出る。
  points:
    - "土曜開講。第1〜4土曜の3つの時間枠"
    - "体験は無料です"
  link_text: "料金とスケジュールの詳細を見る"

# 料金ページの結び
trial_note: "ご不明な点は、無料体験のときにお気軽にお尋ねください。入会のお約束は必要ありません。"

plan:
  name: "料金"
  price: "¥14,000"
  period: "月2回 各60分"
  features:
    - "少人数個別指導"
    - "自分のペースで学習"
    - "感覚過敏への配慮"
    - "毎月のおたより"
    - "教材費込み"
  note: "無料体験授業を実施しています"

# 入会金
enrollment_fee:
  amount: "¥24,000"
  note: "初回のみ"

# ========================================
# スケジュール
# ========================================
schedule:
  title: "スケジュール"

  # 授業時間割
  # headers の先頭は曜日列。残りが時間枠で、各 rows[].slots と個数を合わせる
  table:
    title: "授業時間割"
    headers:
      - "土曜日"
      #- "09:00-10:00"
      - "10:30-11:30"
      - "13:00-14:00"
      - "14:30-15:30"
    rows:
      - week: "第1土曜"
        slots: ["A", "B", "E"]
      - week: "第2土曜"
        slots: ["×", "C", "D"]
      - week: "第3土曜"
        slots: ["A", "B", "E"]
      - week: "第4土曜"
        slots: ["×", "C", "D"]
      - week: "第5土曜"
        slots: ["×", "×", "×"]

  # 満員クラス（該当する記号のコメントを外すと打消し線が付く）
  # 空配列を明示している（キー自体を落とすと nil になり、
  # include の {% if ... contains slot %} が偽を返す挙動に依存することになる）
  full_classes: []

  # 構造化データ（JSON-LD の openingHoursSpecification）用。
  # 上の table の時間枠と一致させること。
  opening_hours:
    day_of_week: "Saturday"
    opens: "10:30"
    closes: "15:30"

  # 凡例・受講方法
  legend:
    title: "授業時間割の見方・受講方法"
    items:
      - "同じ色・文字 = 同じクラス（月2回、隔週通学）"
      - "× = 休み"
      - "クラスは体験のあとで、お子様の様子と在籍のお子様との相性を考えて、こちらから1〜2つご提案します"
      # 満員クラスが出たら、上の full_classes に記号を足して
      # 次の行のコメントを外す。表に打消し線が付き、凡例に説明が出る。
      # - "打消し線 = 満員"
