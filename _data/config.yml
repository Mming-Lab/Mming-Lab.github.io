# ========================================
# サイト基本情報・SEO設定
# ========================================
#
# 【このファイルの役割】
# サイトのアイデンティティ（名前・説明・ロゴ）と SEO 設定。
# 連絡先・住所・外部フォームURL・SNS は _data/core/contact.yml が正本。
#
# 【使用方法】
# {{ site.data.config.site.name }} のように参照する。
#
# 【_config.yml との役割分担】
# _config.yml      : Jekyll の動作設定（プラグイン、ビルド、permalink）
#                    および jekyll-feed / jekyll-sitemap / absolute_url が
#                    参照する title / description / url
# _data/config.yml : サイト表示データ
#
# 【注意】
# データファイルは Liquid を通らない。{{ }} を書いても展開されず
# 文字列のまま出力される。
# ========================================

# ========================================
# サイト基本情報
# ========================================
site:
  # サイト名（ヘッダー、タイトルタグ、構造化データ）
  name: "mming プログラミング教室"

  # キャッチフレーズ（ヘッダー下部）
  tagline: "発達特性のあるお子様の、もう一つの居場所"

  # 説明文（フッター、構造化データの description、meta description の
  # フォールバック。全ページの3箇所に出る、サイトで最も多く出る一文）
  #
  # 【軸を外さないこと】
  # 以前は「お子様の『好きなこと』『得意なこと』を大切に、一人ひとりの特性に
  # 合わせた指導を行います」だった。発達特性だけが条件に読め、プログラミングへの
  # 興味が必要条件であることが入っていなかった。ここは Google が
  # 「この教室とは何か」として読む文なので、対象を曖昧にしない。
  description: "鹿児島市の、発達特性のあるお子様専門のプログラミング教室。教育版マインクラフトを使います。考えることが好きで、うまくいかないことも含めて試すのが面白いお子様に向いています。"

  # 運営者名（meta author）
  author: "mming プログラミング教室"

  # 言語・地域（og:locale）
  locale: "ja_JP"

  # 注: 本番URLは _config.yml の url を正本とする（absolute_url と
  # jekyll-sitemap が参照するため）。ここには置かない。
  # 注: timezone も _config.yml で管理。

  # SNSシェア用画像（og:image、1200x630px推奨）
  og_image: "/assets/images/site-assets/mming_ogp.webp"

  # サイトロゴ（ヘッダー、40x40px表示）
  logo: "/assets/images/logos/mmingロゴアイコン青.webp"

# ========================================
# SEO設定
# ========================================
seo:
  # 構造化データ（検索結果のリッチリザルト用）
  structured_data:
    # 組織タイプ（_layouts/default.html で LocalBusiness と複合型にしている）
    type: "EducationalOrganization"
    # 価格帯。$ が少ないほど安価という Google のシグナル
    price_range: "$$"

  # 注: meta keywords は Google が完全に無視するため削除した。
  # 注: default_image は site.og_image と同値で二重持ちだったため削除した。
